        <g fill="#64748B"><rect x="32" y="12" width="42" height="8" rx="4"/><rect x="136" y="12" width="42" height="8" rx="4"/><rect x="240" y="12" width="42" height="8" rx="4"/><rect x="32" y="80" width="42" height="8" rx="4"/><rect x="136" y="80" width="42" height="8" rx="4"/><rect x="240" y="80" width="42" height="8" rx="4"/></g>
      </g>
