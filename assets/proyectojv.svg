        <rect y="68" width="88" height="54" rx="10" fill="#FFFFFF"/><rect x="104" y="68" width="88" height="54" rx="10" fill="#FFFFFF"/><rect x="208" y="68" width="88" height="54" rx="10" fill="#FFFFFF"/>
