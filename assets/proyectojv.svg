<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">ProyectoJv — laboratorio educativo interactivo</title>
  <desc id="desc">Panel educativo azul noche con una computadora y seis unidades de aprendizaje.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06152B"/><stop offset=".55" stop-color="#123A65"/><stop offset="1" stop-color="#5B37B7"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DDF5FF"/><stop offset="1" stop-color="#A7C7FF"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1280" height="360" rx="30" fill="url(#bg)"/>
  <circle cx="1130" cy="18" r="190" fill="#8B5CF6" opacity=".16"/><circle cx="1040" cy="350" r="210" fill="#22D3EE" opacity=".10"/>
  <text x="74" y="92" fill="#7DD3FC" font-family="Arial,Segoe UI,sans-serif" font-size="18" font-weight="700" letter-spacing="4">LABORATORIO EDUCATIVO</text>
  <text x="74" y="151" fill="#FFFFFF" font-family="Arial,Segoe UI,sans-serif" font-size="50" font-weight="800">ProyectoJv</text>
  <text x="74" y="194" fill="#D8E8FF" font-family="Arial,Segoe UI,sans-serif" font-size="24">Aprender informática explorando, practicando y creando.</text>
  <g font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="700">
    <rect x="74" y="236" width="132" height="44" rx="14" fill="#0EA5E9"/><text x="140" y="264" text-anchor="middle" fill="#FFFFFF">6 unidades</text>
    <rect x="220" y="236" width="160" height="44" rx="14" fill="#7C3AED"/><text x="300" y="264" text-anchor="middle" fill="#FFFFFF">Prácticas guiadas</text>
    <rect x="394" y="236" width="150" height="44" rx="14" fill="#F59E0B"/><text x="469" y="264" text-anchor="middle" fill="#111827">Evidencias PDF</text>
  </g>
  <g transform="translate(760 53)" filter="url(#shadow)">
