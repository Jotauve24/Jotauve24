    <rect x="21" y="21" width="356" height="186" rx="14" fill="url(#screen)"/>
    <rect x="148" y="240" width="102" height="26" rx="8" fill="#94A3B8"/><rect x="104" y="264" width="190" height="15" rx="7" fill="#CBD5E1"/>
